[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Tell Netlify to ignore these public keys in secret scanning
  # These are intentionally exposed to the client bundle (NEXT_PUBLIC_* vars)
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

